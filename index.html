<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Bachao Game - Free Online Balloon Game 2026</title>
<meta name="description" content="Balloon Bachao Game khelo free me! Nukile se apne balloon ko bachao, coin collect karo aur high score banao. Mobile aur PC dono me khelo.">
<meta name="keywords" content="balloon bachao game, balloon game online, free balloon game, hindi game, balloon bachao">
<style>
body{background:white; text-align:center; font-family:'Segoe Script', cursive; margin:0; padding:8px 0; position:relative; overflow-x:hidden}
.bg-balloon {position:fixed; font-size:40px; bottom:-100px; animation: rise 15s linear infinite; opacity:0.3; z-index:0; pointer-events:none;}
@keyframes rise {0% {transform:translateY(0) rotate(0deg)} 100% {transform:translateY(-120vh) rotate(360deg)}}
.player {position:absolute; font-size:48px; bottom:8px; filter: drop-shadow(0 0 6px red);}
.enemy {position:absolute; font-size:38px; filter: drop-shadow(0 0 5px red);}
.coin {position:absolute; font-size:32px; filter: drop-shadow(0 0 8px gold); animation: spin 1s linear infinite;}
@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
.explosion {position:absolute; font-size:65px; animation: boom 0.3s forwards;}
@keyframes boom {0% {transform: scale(0.5); opacity:1} 100% {transform: scale(2); opacity:0}}
</style>
</head>
<body>
<h1 style="margin:5px 0; font-size:24px; color:#FF69B4; font-style:italic; font-weight:bold; position:relative; z-index:1">🎈 Balloon Bachao Game 🎈</h1>
<h2 style="margin:3px 0; font-size:18px; font-style:italic; color:#8A2BE2; font-weight:bold; position:relative; z-index:1">Welcome election</h2>
<p style="font-size:15px; margin:3px 0; font-style:italic; color:#555; position:relative; z-index:1">Big election 2026- Coin earn Karo</p>

<div style="display:flex; justify-content:center; gap:6px; margin:10px 5px; flex-wrap:wrap; position:relative; z-index:1">
<span style="border:2px solid #FFB6C1; padding:5px 10px; border-radius:12px; font-size:14px; background:#FFE4E1; font-style:italic; color:#8B0000">Level - 1</span>
<span style="border:2px solid #ADD8E6; padding:5px 10px; border-radius:12px; font-size:14px; background:#E0FFFF; font-style:italic; color:#000080">Score : 0</span>
<span style="border:2px solid #FFFACD; padding:5px 10px; border-radius:12px; font-size:14px; background:#FFFACD; font-style:italic; color:#8B4513">High Score : 0</span>
<span style="border:2px solid #D8BFD8; padding:5px 10px; border-radius:12px; font-size:14px; background:#E6E6FA; font-style:italic; color:#4B0082">Coins : 0</span>
</div>

<div style="position:relative; display:flex; justify-content:center; align-items:center; margin:10px 0; z-index:1">
<div id="gameArea" style="position:relative; height:360px; width:290px; overflow:hidden; background:#E6F3FF; border:4px solid black; border-radius:4px"></div>
</div>

<div id="controlBox" style="border:4px solid black; display:inline-flex; align-items:center; padding:12px; border-radius:15px; background:#D3D3D3; margin:10px 0; position:relative; z-index:10; gap:10px">
<button onclick="movePlayer(-1)" style="padding:20px 24px; font-size:28px; border:4px solid black; background:white; border-radius:50%; font-weight:bold">←</button>
<button onclick="startGame()" style="padding:14px 18px; font-size:17px; border:3px solid black; background:#FFA500; color:white; border-radius:12px; font-weight:bold">Game<br>Start</button>
<button onclick="movePlayer(1)" style="padding:20px 24px; font-size:28px; border:4px solid black; background:white; border-radius:50%; font-weight:bold">→</button>
</div>

<script>
let score=0, coins=0, highScore=0, level=1, gameRunning=false;
let playerX=145, enemies=[], coin=null, gameArea=document.getElementById('gameArea');

function startGame(){
    if(gameRunning) return;
    gameRunning=true; score=0; coins=0; enemies=[];
    updateUI(); spawnEnemy(); spawnCoin(); gameLoop();
}
function movePlayer(dir){ if(gameRunning) playerX += dir*15; if(playerX<0) playerX=0; if(playerX>250) playerX=250; }
function spawnEnemy(){ if(!gameRunning) return; let e=document.createElement('div'); e.className='enemy'; e.innerHTML='💣'; e.style.left=Math.random()*250+'px'; e.style.top='-40px'; gameArea.appendChild(e); enemies.push(e); setTimeout(spawnEnemy, 1500-level*100); }
function spawnCoin(){ if(!gameRunning) return; if(coin) coin.remove(); coin=document.createElement('div'); coin.className='coin'; coin.innerHTML='🪙'; coin.style.left=Math.random()*250+'px'; coin.style.top='50px'; gameArea.appendChild(coin); }
function gameLoop(){ if(!gameRunning) return;
    let player=document.querySelector('.player'); if(!player){ player=document.createElement('div'); player.className='player'; player.innerHTML='🎈'; gameArea.appendChild(player); }
    player.style.left=playerX+'px';
    enemies.forEach((e,i)=>{ e.style.top=parseInt(e.style.top)+4+level+'px';
        if(parseInt(e.style.top)>360){ e.remove(); enemies.splice(i,1); }
        if(Math.abs(playerX-parseInt(e.style.left))<40 && parseInt(e.style.top)>320){ gameOver(); }
    });
    if(coin && Math.abs(playerX-parseInt(coin.style.left))<40 && parseInt(coin.style.top)>320){ coins++; score+=10; coin.remove(); spawnCoin(); updateUI(); }
    score++; updateUI(); requestAnimationFrame(gameLoop);
}
function updateUI(){ document.querySelectorAll('span')[1].innerText='Score : '+score; document.querySelectorAll('span')[2].innerText='High Score : '+highScore; document.querySelectorAll('span')[3].innerText='Coins : '+coins; }
function gameOver(){ gameRunning=false; if(score>highScore) highScore=score; alert('Game Over! Score: '+score); }

// Background balloons
for(let i=0;i<10;i++){ let b=document.createElement('div'); b.className='bg-balloon'; b.innerHTML='🎈'; b.style.left=Math.random()*100+'%'; b.style.animationDelay=Math.random()*10+'s'; document.body.appendChild(b); }
</script>
</body>
</html>
