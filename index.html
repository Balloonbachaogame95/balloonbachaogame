<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎈 Balloon Bachao Game 🎈</title>
</head>
<body style="background:white; text-align:center; font-family:'Segoe Script', cursive; margin:0; padding:8px 0; position:relative; overflow-x:hidden">

    <!-- WATERMARK -->
    <div style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%) rotate(-30deg); font-size:40px; color:rgba(255,105,180,0.08); font-weight:bold; pointer-events:none; z-index:0; white-space:nowrap">Balloon Bachao Balloon Bachao</div>

    <!-- TITLE -->
    <h1 style="margin:5px 0; font-size:24px; color:#FF69B4; font-style:italic; font-weight:bold">🎈 Balloon Bachao Game 🎈</h1>
    <h2 style="margin:3px 0; font-size:18px; font-style:italic; color:#8A2BE2; font-weight:bold">Welcome election</h2>
    <p style="font-size:15px; margin:3px 0; font-style:italic; color:#555">Big election 2026- Coin earn Karo</p>

    <!-- STATS -->
    <div style="display:flex; justify-content:center; gap:6px; margin:10px 5px; flex-wrap:wrap">
      <span style="border:2px solid #FFB6C1; padding:5px 10px; border-radius:12px; font-size:14px; background:#FFE4E1; font-style:italic; color:#8B0000">Level - 1</span>
      <span style="border:2px solid #ADD8E6; padding:5px 10px; border-radius:12px; font-size:14px; background:#E0FFFF; font-style:italic; color:#000080">Score : 0</span>
      <span style="border:2px solid #FFFACD; padding:5px 10px; border-radius:12px; font-size:14px; background:#FFFACD; font-style:italic; color:#8B4513">High Score : 0</span>
      <span style="border:2px solid #D8BFD8; padding:5px 10px; border-radius:12px; font-size:14px; background:#E6E6FA; font-style:italic; color:#4B0082">Coins : 0</span>
    </div>

    <!-- GAME BOX -->
    <div style="display:flex; justify-content:center; margin:10px 0">
      <div id="gameArea" style="position:relative; height:360px; width:290px; overflow:hidden; background:#E6F3FF; border:4px solid black; border-radius:4px">
        <div style="position:absolute; left:20%; top:0; width:3px; height:100%; background:black"></div>
        <div style="position:absolute; left:40%; top:0; width:3px; height:100%; background:black"></div>
        <div style="position:absolute; left:60%; top:0; width:3px; height:100%; background:black"></div>
        <div style="position:absolute; left:80%; top:0; width:3px; height:100%; background:black"></div>
      </div>
    </div>

    <!-- CONTROL BOX -->
    <div id="controlBox" style="border:4px solid black; display:inline-flex; align-items:center; padding:12px; border-radius:15px; background:#D3D3D3; margin:10px 0; gap:10px">
      <button onclick="toggleMusic()" id="musicBtn" style="padding:10px 12px; border:3px solid black; border-radius:50%; background:#87CEEB; font-size:18px">🔊</button>
      <button onclick="movePlayer(-1)" style="padding:20px 24px; font-size:28px; border:4px solid black; background:white; border-radius:50%; font-weight:bold">←</button>
      <button onclick="startGame()" style="padding:14px 18px; font-size:17px; border:3px solid black; background:#FFA500; color:white; border-radius:12px; font-weight:bold">Game<br>Start</button>
      <button onclick="movePlayer(1)" style="padding:20px 24px; font-size:28px; border:4px solid black; background:white; border-radius:50%; font-weight:bold">→</button>
    </div>

<script>
let score = 0; let coins = 0; let playerLane = 2; let level = 1;
let gameInterval; let enemyInterval; let coinInterval;
let enemySpeed = 7; let spawnRate = 800;
let highscore = localStorage.getItem("highscore") || 0;
let musicOn = true;
const lanes = [8, 66, 124, 182, 240];
const nukile = ["📍", "📌", "🔪", "✂️", "⚡", "💣", "💣"];
let gameActive = false;

function toggleMusic(){musicOn =!musicOn; document.getElementById("musicBtn").innerHTML = musicOn? "🔊" : "🔇";}

function startGame(){
  score = 0; coins = 0; playerLane = 2; gameActive = true;
  updateStats();
  document.getElementById("gameArea").innerHTML = `<div style="position:absolute; left:20%; top:0; width:3px; height:100%; background:black"></div><div style="position:absolute; left:40%; top:0; width:3px; height:100%; background:black"></div><div style="position:absolute; left:60%; top:0; width:3px; height:100%; background:black"></div><div style="position:absolute; left:80%; top:0; width:3px; height:100%; background:black"></div>`;
  createPlayer(); 
  alert("Game Start! ← → se khelo");
}

function updateStats(){
  let spans = document.querySelectorAll("span");
  spans[0].innerHTML="Level - "+level;
  spans[1].innerHTML="Score : "+score;
  spans[2].innerHTML="High Score : "+highscore;
  spans[3].innerHTML="Coins : "+coins;
}

function createPlayer(){let player = document.createElement("div"); player.id = "player"; player.innerHTML = "🎈"; player.style.position="absolute"; player.style.fontSize="48px"; player.style.bottom="8px"; player.style.left = lanes[playerLane] + "px"; document.getElementById("gameArea").appendChild(player);}
function movePlayer(dir){if(!gameActive) return; playerLane += dir; if(playerLane < 0) playerLane = 0; if(playerLane > 4) playerLane = 4; document.getElementById("player").style.left = lanes[playerLane] + "px";}
</script>
</body>
</html>
